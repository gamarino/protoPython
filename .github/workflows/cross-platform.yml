name: Cross-platform

# macOS and Windows. Linux is ci.yml's (the add_subdirectory configuration, with
# protoCore's own suite). This workflow adds the two platforms nobody here can
# run locally, against an INSTALLED protoCore package -- the supported mode on
# Windows -- with GoogleTest fetched so the C++ suites run too. protoCore refs,
# exactly:
#   * macOS and the first Windows job build protoCore 2.9.4 (tag v2.9.4, commit
#     9cb0ef54), as ci.yml does on Linux;
#   * the "floor" Windows job builds protoCore 2.7.0 (tag v2.7.0, commit
#     fc5d79db), PROTOCORE_MIN_VERSION in CMakeLists.txt, the oldest release
#     protoPython accepts.  It is the repository's only floor job.  (No macOS
#     floor job: below 2.8.0 protoCore's threads get 512 KiB stacks there,
#     ProtoSpace::setThreadStackBytes.)

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTOCORE_REPO: numaes/protoCore
  # As in ci.yml: cases whose verdict is a clock never gate.
  CLOCK_DEPENDENT_TESTS: '^(protopy_dict_key_hash|conformance_isolate\..*|conformance\.isolate\..*)$'

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple clang, arm64)
            os: macos-14
            # protoCore 2.9.4 (tag v2.9.4)
            protocore_ref: 9cb0ef540826ee6c3162998db84ddf48464d6e2a
          - name: Windows (MSVC, x64)
            os: windows-2022
            # protoCore 2.9.4 (tag v2.9.4)
            protocore_ref: 9cb0ef540826ee6c3162998db84ddf48464d6e2a
          - name: Windows (MSVC, x64), protoCore 2.7.0 floor
            os: windows-2022
            # THE FLOOR JOB, the only one: protoCore 2.7.0 (tag v2.7.0),
            # PROTOCORE_MIN_VERSION in CMakeLists.txt
            protocore_ref: fc5d79db4f89f8a6eb473a52766b1908140a19d1
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out protoPython
        uses: actions/checkout@v4
        with:
          path: protoPython

      - name: Check out protoCore as a sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTOCORE_REPO }}
          ref: ${{ matrix.protocore_ref }}
          path: protoCore

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          for f in ninja coreutils; do brew list "$f" >/dev/null 2>&1 || brew install "$f"; done
          # The test scripts use GNU timeout, which macOS does not ship.
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and install protoCore
        run: |
          cmake -S protoCore -B protoCore/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build protoCore/build --parallel 4
          cmake --install protoCore/build --prefix "$GITHUB_WORKSPACE/prefix"

      - name: Configure protoPython
        working-directory: protoPython
        run: >
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/prefix"
          -DPROTOPYTHON_FETCH_GOOGLETEST=ON

      - name: Build protoPython
        id: build
        working-directory: protoPython
        run: cmake --build build --parallel 4

      - name: Report the registered test count
        working-directory: protoPython
        run: |
          COUNT=$(ctest --test-dir build -N | tail -1)
          echo "$COUNT"
          echo "protoPython ctest (${{ runner.os }}): $COUNT" >> "$GITHUB_STEP_SUMMARY"

      - name: Test suite
        working-directory: protoPython
        run: ctest --test-dir build -j2 --output-on-failure --timeout 600 -E "$CLOCK_DEPENDENT_TESTS" < /dev/null

      # Heap-limited collection under file and allocation pressure, repeated:
      # a context chained off the thread's current one let the collector free
      # objects of running frames in about one Windows run in ten (CI run
      # 36987826465). Each test runs up to 25 times and the step fails at the
      # first failing run.
      - name: Heap-limit collection, repeated
        # Also after a failing suite: its verdict is independent evidence.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: protoPython
        run: |
          ctest --test-dir build --output-on-failure --timeout 300 --repeat until-fail:25 \
            -R '^(protopy_heap_limit_live_frames|protopy_file_close_on_collect)$' < /dev/null
          echo "Heap-limit tests: 25 consecutive passing runs each" >> "$GITHUB_STEP_SUMMARY"

      # The Windows package: every generator the configuration enabled (the ZIP,
      # and the NSIS installer when makensis is on the runner). The ZIP is
      # unpacked into a fresh directory and run from there with PATH holding
      # only the Windows system directories: nothing from the build tree or the
      # protoCore prefix can be found, so every DLL protopy.exe needs must come
      # from the ZIP. The runner has the MSVC runtime installed system-wide, so
      # its DLLs are checked by name.
      - name: Windows ZIP package, run from a clean directory
        if: runner.os == 'Windows'
        working-directory: protoPython/build
        run: |
          cpack
          if grep -q 'CPACK_GENERATOR "[^"]*NSIS' CPackConfig.cmake; then
            ls protopython-*-win64.exe || { echo "NSIS was enabled but built no installer"; exit 1; }
            echo "Windows installer built: $(ls protopython-*-win64.exe)" >> "$GITHUB_STEP_SUMMARY"
          fi
          zip=$(ls protopython-*-win64.zip | head -1)
          listing=$(7z l "$zip" | tr -d '\r')
          for dll in protoPython.dll vcruntime140.dll msvcp140.dll; do
            grep -qi "bin.$dll\$" <<<"$listing" || { echo "the ZIP has no bin/$dll"; exit 1; }
          done
          grep -qiE 'bin.protoCore(-[0-9]+)?\.dll$' <<<"$listing" || { echo "the ZIP has no protoCore DLL"; exit 1; }
          dest="$(cygpath -u "$RUNNER_TEMP")/zip-run"
          rm -rf "$dest" && mkdir -p "$dest/work"
          7z x -o"$dest" "$zip" >/dev/null
          exe=$(ls "$dest"/*/bin/protopy.exe)
          printf 'import sys, json, re, tempfile\nprint(sys.platform, json.dumps([1, 2]), sum(range(11)))\n' > "$dest/work/check.py"
          cd "$dest/work"
          sys="$(cygpath -u "$WINDIR")/System32"
          clean_path="$sys:$(cygpath -u "$WINDIR"):$sys/Wbem"
          out=$(/usr/bin/env PATH="$clean_path" "$exe" check.py | tr -d '\r')
          echo "$out"
          [ "$out" = "win32 [1, 2] 55" ] || { echo "unexpected output from the unpacked protopy"; exit 1; }
          echo "Windows ZIP: $zip ran from a clean directory with only system directories on PATH" >> "$GITHUB_STEP_SUMMARY"

