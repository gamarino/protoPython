name: Windows heap-limit diagnostics

# TEMPORARY (branch diag/win-heaplimit-crash): reproduces the Windows-only
# crash of test/regression/file_close_on_collect.py under
# PROTOCORE_HEAP_LIMIT_CELLS and collects stacks. Not for merge.

on:
  push:
    branches: ['diag/win-heaplimit-crash']

permissions:
  contents: read

jobs:
  diag:
    name: ${{ matrix.config }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        config: [Release]
    defaults:
      run:
        shell: bash
    env:
      PROTOCORE_REF: diag/win-heaplimit-crash
    steps:
      - uses: actions/checkout@v4
        with:
          path: protoPython
      - uses: actions/checkout@v4
        with:
          repository: numaes/protoCore
          ref: ${{ env.PROTOCORE_REF }}
          path: protoCore
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build protoCore
        run: |
          git -C protoCore log --oneline -1
          cmake -S protoCore -B protoCore/build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DBUILD_TESTING=OFF
          cmake --build protoCore/build --parallel 4
          cmake --install protoCore/build --prefix "$GITHUB_WORKSPACE/prefix"
      - name: Build protopy
        working-directory: protoPython
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} "-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/prefix"
          cmake --build build --parallel 4 --target protopy
      - name: Loops
        working-directory: protoPython
        run: |
          set +e +o pipefail
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE/prefix/bin"):$PATH"
          exe=$(find build -name protopy.exe | head -1)
          echo "exe=$exe"
          sed 's/if sys.platform == "win32":/if False:/' test/regression/file_close_on_collect.py > fcc.py
          loop() {  # label, script, runs, env...
            local label=$1 script=$2 n=$3; shift 3
            declare -A c=()
            for i in $(seq 1 $n); do
              env PROTOCORE_HEAP_LIMIT_CELLS=1000000 "$@" timeout 600 "$exe" "$script" > out.txt 2>&1
              rc=$?
              c[$rc]=$(( ${c[$rc]:-0} + 1 ))
              if [ $rc != 0 ] || ! grep -q 'True True\|: ok' out.txt; then
                echo "--- $label run $i rc=$rc"; tail -c 600 out.txt; echo
              fi
            done
            local s=""; for k in "${!c[@]}"; do s="$s rc$k:${c[$k]}"; done
            echo "=== SUMMARY $label (n=$n):$s"
            echo "$label (n=$n):$s" >> summary.txt
          }
          OLD="PROTOCORE_DIAG_OLD_ORDER=1 PROTOPY_DIAG_OLD_PARENT=1"
          P14=tests/gcprobe/p14.py
          echo "CTX mismatches, old parent: $(env PROTOCORE_CTX_CHECK=1 PROTOPY_DIAG_OLD_PARENT=1 "$exe" $P14 2>&1 | grep -c 'CTX CHECK')"
          echo "CTX mismatches, fixed parent: $(env PROTOCORE_CTX_CHECK=1 "$exe" $P14 2>&1 | grep -c 'CTX CHECK')"
          loop "forced-cycle base" $P14 3 $OLD PROTOCORE_GC_FORCE_AT_RETURN=10 PROTOCORE_GC_POISON=1
          loop "forced-cycle both-fixes" $P14 3 PROTOCORE_GC_FORCE_AT_RETURN=10 PROTOCORE_GC_POISON=1
          loop "p14 base" $P14 30 $OLD
          loop "p14 core-fix-only" $P14 30 PROTOPY_DIAG_OLD_PARENT=1
          loop "p14 py-fix-only" $P14 30 PROTOCORE_DIAG_OLD_ORDER=1
          loop "p14 both-fixes" $P14 60
          loop "fcc base" fcc.py 20 $OLD
          loop "fcc both-fixes" fcc.py 40
          cat summary.txt
          cat summary.txt >> "$GITHUB_STEP_SUMMARY"
